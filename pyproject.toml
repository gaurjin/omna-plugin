[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omna-plugin"
version = "0.5.0"
description = "Omna — local privacy proxy for AI coding tools. Masks secrets and PII before a prompt leaves your machine, restores them in the reply."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "gaurav", email = "gaurjin@gmail.com" }]
keywords = ["privacy", "pii", "secrets", "proxy", "claude-code", "aider", "openai", "anthropic", "dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "omna-pii-mask>=0.2.6,<0.3",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "mitmproxy>=12.2,<13",
    "pystray>=0.19,<1",
    "pillow>=10",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]

[project.scripts]
omna = "omna_plugin.cli:main"

[project.urls]
Homepage = "https://omna.dev"
Repository = "https://github.com/gaurjin/omna-plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/omna_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]   # so a test can import its own helpers as ``tests.<helper>``
